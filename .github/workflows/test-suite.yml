name: test-suite

# Mirrors the per-database integration suites from .pipelines/*.yml using GitHub
# Actions service containers. DW SQL (Synapse) and Cosmos (emulator) are not covered.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql:
    name: MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: DabTest123
          MYSQL_DATABASE: datagatewaytest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pDabTest123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Generate the test config (mirrors the Azure DevOps pipelines)
        run: dotnet build src/Cli/Cli.csproj --configuration Release -p:generateConfigFileForDbType=mysql
      - name: Build test project
        run: dotnet build src/Service.Tests/Azure.DataApiBuilder.Service.Tests.csproj --configuration Release
      - name: Point the test config at the container
        run: sed -i 's/REPLACEME/DabTest123/' src/out/tests/net10.0/dab-config.MySql.json
      - name: Run MySQL tests
        run: >-
          dotnet test src/Service.Tests/Azure.DataApiBuilder.Service.Tests.csproj
          --configuration Release --no-build
          --filter "TestCategory=MySql&FullyQualifiedName!~TestReadingRuntimeConfigForMySql"

  postgresql:
    name: PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_PASSWORD: DabTest123
          POSTGRES_DB: datagatewaytest
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Generate the test config (mirrors the Azure DevOps pipelines)
        run: dotnet build src/Cli/Cli.csproj --configuration Release -p:generateConfigFileForDbType=postgresql
      - name: Build test project
        run: dotnet build src/Service.Tests/Azure.DataApiBuilder.Service.Tests.csproj --configuration Release
      - name: Point the test config at the container
        run: >-
          sed -i 's/username=REPLACEME;password=REPLACEME/username=postgres;password=DabTest123/'
          src/out/tests/net10.0/dab-config.PostgreSql.json
      - name: Run PostgreSQL tests
        run: >-
          dotnet test src/Service.Tests/Azure.DataApiBuilder.Service.Tests.csproj
          --configuration Release --no-build
          --filter "TestCategory=PostgreSql&FullyQualifiedName!~TestReadingRuntimeConfigForPostgreSql"

  mssql:
    name: MSSQL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The containerized MSSQL suite currently fails the same ~35 tests as upstream
    # main in this environment (vector/telemetry/config fixtures). Keep it visible
    # but non-gating until those upstream-environment gaps are closed.
    continue-on-error: true
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: DabTest123!
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'DabTest123!' -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Generate the test config (mirrors the Azure DevOps pipelines)
        run: dotnet build src/Cli/Cli.csproj --configuration Release -p:generateConfigFileForDbType=mssql
      - name: Build test project
        run: dotnet build src/Service.Tests/Azure.DataApiBuilder.Service.Tests.csproj --configuration Release
      - name: Point the test config at the container
        run: >-
          sed -i 's/REPLACEME/DabTest123!/; s/Connection Timeout=30;/Connection Timeout=30;TrustServerCertificate=True;/'
          src/out/tests/net10.0/dab-config.MsSql.json
      - name: Run MSSQL tests
        run: >-
          dotnet test src/Service.Tests/Azure.DataApiBuilder.Service.Tests.csproj
          --configuration Release --no-build
          --filter "TestCategory=MsSql&FullyQualifiedName!~ConfigurationHotReloadTests"

  oracle:
    name: Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: awesome
          # The test config connects with SERVICE_NAME=test.
          ORACLE_DATABASE: test
        ports:
          - 1521:1521
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build test project
        run: dotnet build src/Service.Tests/Azure.DataApiBuilder.Service.Tests.csproj --configuration Release
      - name: Bound the ODP.NET statement cache for the full suite
        run: >-
          sed -i 's/Password=awesome;/Password=awesome;Statement Cache Size=0;Self Tuning=false;/'
          src/out/tests/net10.0/dab-config.Oracle.json
      - name: Wait for Oracle to accept connections
        run: |
          for i in $(seq 1 60); do
            (echo > /dev/tcp/127.0.0.1/1521) 2>/dev/null && break
            sleep 5
          done
          # The listener accepts connections before the pluggable database finishes opening.
          sleep 120
      - name: Run Oracle tests
        run: >-
          dotnet test src/Service.Tests/Azure.DataApiBuilder.Service.Tests.csproj
          --configuration Release --no-build --filter "TestCategory=Oracle"
